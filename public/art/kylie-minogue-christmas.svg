<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="kylie-minogue-christmas_grad" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#c41c7a" />
      <stop offset="60%" stop-color="#79144d" />
      <stop offset="100%" stop-color="#2b091f" />
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4cf" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#aa771c" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="festive-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="rgba(255,255,255,0.08)" />
      <path d="M 20 5 L 20 35 M 5 20 L 35 20" stroke="rgba(255,255,255,0.03)" stroke-width="0.5" />
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="600" height="600" fill="url(#kylie-minogue-christmas_grad)" />
  <rect width="600" height="600" fill="url(#festive-grid)" />

  <!-- Outer Elegant Frame -->
  <rect x="24" y="24" width="552" height="552" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" />
  <rect x="32" y="32" width="536" height="536" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="0.75" />

  <!-- Corner Flourishes -->
  <circle cx="32" cy="32" r="4" fill="#ffb6d9" opacity="0.8" />
  <circle cx="568" cy="32" r="4" fill="#ffb6d9" opacity="0.8" />
  <circle cx="32" cy="568" r="4" fill="#ffb6d9" opacity="0.8" />
  <circle cx="568" cy="568" r="4" fill="#ffb6d9" opacity="0.8" />

  <!-- Warner Shield Icon Crest -->
  <g transform="translate(300, 90)">
    <circle cx="0" cy="0" r="32" fill="rgba(0,0,0,0.35)" stroke="#ffb6d9" stroke-width="1.5" />
    <path d="M -16,-18 L 16,-18 C 16,-18 18,12 0,22 C -18,12 -16,-18 -16,-18 Z" fill="none" stroke="#ffb6d9" stroke-width="2" />
    <text x="0" y="7" font-family="'Inter', sans-serif" font-weight="900" font-size="14" fill="#ffb6d9" text-anchor="middle" letter-spacing="1">W</text>
  </g>
  <text x="300" y="140" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="rgba(255,255,255,0.7)" text-anchor="middle" letter-spacing="4">WARNER RECORDS</text>

  <!-- Floating Starbursts & Holiday Glow -->
  <g opacity="0.75">
    <path d="M 120 180 Q 120 200 100 200 Q 120 200 120 220 Q 120 200 140 200 Q 120 200 120 180" fill="#ffb6d9" />
    <path d="M 480 190 Q 480 205 465 205 Q 480 205 480 220 Q 480 205 495 205 Q 480 205 480 190" fill="#ffb6d9" />
    <path d="M 160 410 Q 160 420 150 420 Q 160 420 160 430 Q 160 420 170 420 Q 160 420 160 410" fill="#ffb6d9" opacity="0.6"/>
    <path d="M 450 420 Q 450 430 440 430 Q 450 430 450 440 Q 450 430 460 430 Q 450 430 450 420" fill="#ffb6d9" opacity="0.6"/>
  </g>

  <!-- Central Festive Motif -->
  <g transform="translate(300, 255)">
    <!-- Aura disc -->
    <circle cx="0" cy="0" r="82" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)" stroke-dasharray="4 4" />
    <circle cx="0" cy="0" r="68" fill="rgba(0,0,0,0.3)" stroke="#ffb6d9" stroke-width="1.2" opacity="0.9" />
    
    <!-- Central Holiday Iconography -->
    <path d="M 0 -45 L 8 -16 L 38 -16 L 14 3 L 23 32 L 0 15 L -23 32 L -14 3 L -38 -16 L -8 -16 Z" fill="url(#gold)" opacity="0.9" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="5" fill="#ffffff" />
  </g>

  <!-- Title & Artist Typography -->
  <g text-anchor="middle">
    <!-- Category / Badge -->
    <rect x="180" y="362" width="240" height="24" rx="12" fill="rgba(0,0,0,0.4)" stroke="#ffb6d9" stroke-width="0.8"/>
    <text x="300" y="378" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#ffb6d9" letter-spacing="2">FULLY WRAPPED • 10TH ANNIV.</text>

    <!-- Main Artist Name -->
    <text x="300" y="425" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="4">KYLIE MINOGUE</text>
    
    <!-- Subtitle / Album Title -->
    <text x="300" y="465" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="22" font-weight="600" fill="#ffb6d9" letter-spacing="3">KYLIE CHRISTMAS</text>

    <!-- Divider Line -->
    <line x1="200" y1="488" x2="400" y2="488" stroke="rgba(255,255,255,0.2)" stroke-width="1" />

    <!-- Featured Tracks Snippet -->
    <text x="300" y="515" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="rgba(255,255,255,0.75)" letter-spacing="1">Hot In December • Santa Baby • Office Party</text>
    <text x="300" y="542" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="rgba(255,255,255,0.45)" letter-spacing="2">SYNC &amp; PARTNER LICENSING MASTER</text>
  </g>
</svg>
